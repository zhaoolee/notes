services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "15173:15173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    environment:
      PORT: "3001"
      EXPORT_APP_URL: http://frontend:15173
      IMAGE_STORAGE_DIR: /app/storage/images
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      QINIU_PREFIX: ${QINIU_PREFIX:-}
      QINIU_UPLOAD_URL: ${QINIU_UPLOAD_URL:-}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - ./storage/images:/app/storage/images

volumes:
  frontend_node_modules:
  backend_node_modules:
