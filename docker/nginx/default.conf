map $http_x_forwarded_proto $notes_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $notes_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    # Hugo exports may include remote images and a complete static build.
    proxy_read_timeout 150s;
  }

  location /images/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $notes_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /qiniu/ {
    proxy_pass http://tmp-blog.fangyuanxiaozhan.com/;
    proxy_http_version 1.1;
    proxy_set_header Host tmp-blog.fangyuanxiaozhan.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /notes {
    absolute_redirect off;
    return 308 /notes/$is_args$args;
  }

  # 本站镜像由后端直接提供；缺失页面/资源保持 404，不回退到编辑器。
  location /notes/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $notes_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
